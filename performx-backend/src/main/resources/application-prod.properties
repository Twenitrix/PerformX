# AWS Production Profile (activate with --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod)
# Defaults to persistent file-backed H2 on EC2 if no RDS URL is supplied; set SPRING_DATASOURCE_URL for Amazon RDS PostgreSQL.
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/performx;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
performx.jwt.secret=${JWT_SECRET:cGVyZm9ybXgtZGVtby1zZWNyZXQta2V5LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTI1Ng==}
performx.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
performx.cors.origins=${CORS_ORIGINS:*}
