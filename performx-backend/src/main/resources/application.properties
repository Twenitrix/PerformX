spring.application.name=performx
server.port=8080
spring.datasource.url=jdbc:h2:mem:performx;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
performx.jwt.secret=${JWT_SECRET:cGVyZm9ybXgtZGVtby1zZWNyZXQta2V5LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTI1Ng==}
performx.jwt.expiration-ms=28800000
performx.cors.origins=http://localhost:5173
